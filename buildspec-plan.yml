version: 0.2

# This buildspec is used for TERRAFORM PLAN phase
# Generates execution plan showing what will change (read-only, no changes to AWS)

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - export TF_DIR="${TF_DIR:-infra}"
      - export TF_ENV="${TF_ENV:-dev}"
      - echo "[INFO] TF_DIR=${TF_DIR}"
      - echo "[INFO] TF_ENV=${TF_ENV}"
      - echo "[INFO] Installing Terraform"
      - TF_VERSION="1.7.5"
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform -version
  pre_build:
    commands:
      - set -euo pipefail
      - export TF_DIR="${TF_DIR:-infra}"
      - export TF_ENV="${TF_ENV:-dev}"
      - echo "[INFO] TF_DIR=${TF_DIR}, TF_ENV=${TF_ENV}"

      # Package and upload artifacts (only if ARTIFACT_BUCKET is set)
      - |
        if [ -n "${ARTIFACT_BUCKET:-}" ]; then
          echo "[INFO] ========== PACKAGING LAMBDAS AND LAYER =========="
          mkdir -p dist
        else
          echo "[INFO] ARTIFACT_BUCKET not set; skipping package/upload"
        fi

      # For Scheduler Lambda
      - |
        if [ -n "${ARTIFACT_BUCKET:-}" ]; then
          echo "[INFO] Packaging Scheduler Lambda"
          cd lambdas/scheduler
          zip -r "../../dist/scheduler.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo"
          cd - > /dev/null
          aws s3 cp dist/scheduler.zip "s3://${ARTIFACT_BUCKET}/${SCHEDULER_S3_KEY:-lambdas/scheduler.zip}"
          echo "[SUCCESS] Scheduler Lambda uploaded"
        fi

      # For Sync Lambda
      - |
        if [ -n "${ARTIFACT_BUCKET:-}" ]; then
          echo "[INFO] Packaging Sync Lambda"
          cd lambdas/sync
          zip -r "../../dist/sync.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo"
          cd - > /dev/null
          aws s3 cp dist/sync.zip "s3://${ARTIFACT_BUCKET}/${SYNC_S3_KEY:-lambdas/sync.zip}"
          echo "[SUCCESS] Sync Lambda uploaded"
        fi

      # For Lambda Layer
      - |
        if [ -n "${ARTIFACT_BUCKET:-}" ]; then
          echo "[INFO] Packaging Lambda Layer"
          cd layers/python
          zip -r "../../dist/python_layer.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo"
          cd - > /dev/null
          aws s3 cp dist/python_layer.zip "s3://${ARTIFACT_BUCKET}/${LAYER_S3_KEY:-layers/python_layer.zip}"
          echo "[SUCCESS] Lambda Layer uploaded"
        fi

      # For HTML assets (optional)
      - |
        if [ -n "${ARTIFACT_BUCKET:-}" ] && [ -n "${HTML_SRC:-}" ]; then
          echo "[INFO] Uploading HTML assets"
          aws s3 sync "${HTML_SRC}" "s3://${ARTIFACT_BUCKET}/${HTML_PREFIX:-html/}"
          echo "[SUCCESS] HTML assets uploaded"
        fi

      # Terraform initialization
      - cd "${TF_DIR}"
      - test -f "environments/${TF_ENV}.tfvars" || (echo "[ERROR] Missing tfvars: ${TF_DIR}/environments/${TF_ENV}.tfvars" && exit 1)
      - echo "[INFO] ========== TERRAFORM INIT =========="
      - |
        terraform init -input=false \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
          -backend-config="key=${TF_STATE_KEY}" \
          -backend-config="encrypt=true"
  build:
    commands:
      - set -euo pipefail
      - echo "[INFO] terraform validate"
      - terraform validate
      - echo "[INFO] terraform plan"
      - terraform plan -input=false -no-color \
          -var-file="environments/${TF_ENV}.tfvars" \
          -out="./tfplan"
  post_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] Plan completed successfully"
      - echo "[PLAN] Review the plan output above before approving"

artifacts:
  files:
    - './tfplan'
  name: TfPlanOutput
  discard-paths: yes
