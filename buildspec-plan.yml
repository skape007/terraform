version: 0.2

# This buildspec is used for TERRAFORM PLAN phase
# TF_ENV is set by the pipeline (CodeBuild environment variable) per environment
# Generates execution plan showing what will change (read-only, no changes to AWS)

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - export TF_DIR="${TF_DIR:-infra}"
      - export TF_ENV="${TF_ENV:-dev}"
      - echo "[INFO] TF_DIR=${TF_DIR}"
      - echo "[INFO] TF_ENV=${TF_ENV}"
      - echo "[INFO] Installing Terraform"
      - TF_VERSION="1.14.6"
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform -version
  pre_build:
    commands:
      - set -euo pipefail
      - export TF_DIR="${TF_DIR:-infra}"
      - export TF_ENV="${TF_ENV:-dev}"
      - echo "[INFO] TF_DIR=${TF_DIR}, TF_ENV=${TF_ENV}"

      - echo "[INFO] ========== PACKAGING LAMBDAS AND LAYER =========="
      - mkdir -p dist
      - export BUILD_TS=`date +%s`
      - echo "[INFO] BUILD_TS=$BUILD_TS"

      - echo "[INFO] Packaging Scheduler Lambda"
      - cd "$CODEBUILD_SRC_DIR/lambdas/scheduler"
      - zip -r "$CODEBUILD_SRC_DIR/dist/scheduler.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo"
      - aws s3 cp "$CODEBUILD_SRC_DIR/dist/scheduler.zip" "s3://${ARTIFACT_BUCKET}/lambdas/${BUILD_TS}/scheduler.zip"

      - echo "[INFO] Packaging Sync Lambda"
      - cd "$CODEBUILD_SRC_DIR/lambdas/sync"
      - zip -r "$CODEBUILD_SRC_DIR/dist/sync.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo"
      - aws s3 cp "$CODEBUILD_SRC_DIR/dist/sync.zip" "s3://${ARTIFACT_BUCKET}/lambdas/${BUILD_TS}/sync.zip"

      - echo "[INFO] Packaging Lambda Layer"
      - cd "$CODEBUILD_SRC_DIR/layers"
      - zip -r "$CODEBUILD_SRC_DIR/dist/python_layer.zip" python/ -x "*/__pycache__/*" "*.pyc" "*.pyo"
      - aws s3 cp "$CODEBUILD_SRC_DIR/dist/python_layer.zip" "s3://${ARTIFACT_BUCKET}/layers/${BUILD_TS}/python_layer.zip"

      - cd "$CODEBUILD_SRC_DIR"
      - echo "[INFO] ========== TERRAFORM INIT =========="
      - cd "$CODEBUILD_SRC_DIR/${TF_DIR}"
      - test -f "environments/${TF_ENV}.tfvars" || (echo "[ERROR] Missing tfvars" && exit 1)
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - echo "[INFO] Reading Azure PAT from SSM"
      - export AZURE_PAT_VALUE=`aws ssm get-parameter --name "${AZURE_PAT_SSM_NAME}" --with-decryption --query "Parameter.Value" --output text`

  build:
    commands:
      - set -euo pipefail
      - echo "[INFO] terraform validate"
      - terraform validate
      - echo "[INFO] terraform plan"
      - terraform plan -input=false -no-color -var-file="environments/${TF_ENV}.tfvars" -var="scheduler_code_s3_key=lambdas/${BUILD_TS}/automations.zip" -var="sync_code_s3_key=lambdas/${BUILD_TS}/sync.zip" -var="layer_s3_key=layers/${BUILD_TS}/python_layer.zip" -var="azure_pat_encrypted=${AZURE_PAT_VALUE}" -out="$CODEBUILD_SRC_DIR/tfplan"
      - echo "[INFO] Writing human-readable plan output"
      - terraform show -no-color "$CODEBUILD_SRC_DIR/tfplan" > "$CODEBUILD_SRC_DIR/plan.txt"
      - echo "[INFO] Writing plan summary"
      - |
        {
          echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')";
          echo "tf_env=${TF_ENV}";
          echo "commit=${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}";
          # Extract: Plan: X to add, Y to change, Z to destroy.
          grep -E "^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\." "$CODEBUILD_SRC_DIR/plan.txt" | tail -n 1 || true;
        } > "$CODEBUILD_SRC_DIR/plan-summary.txt"
      - echo "[INFO] Uploading plan review files to S3"
      - aws s3 cp "$CODEBUILD_SRC_DIR/plan-summary.txt" "s3://${ARTIFACT_BUCKET}/plans/${TF_ENV}/latest/plan-summary.txt"
      - aws s3 cp "$CODEBUILD_SRC_DIR/plan.txt" "s3://${ARTIFACT_BUCKET}/plans/${TF_ENV}/latest/plan.txt"
      - echo "[INFO] Generating pre-signed URLs (valid 24h)"
      - export PLAN_URL=`aws s3 presign "s3://${ARTIFACT_BUCKET}/plans/${TF_ENV}/latest/plan.txt" --expires-in 86400`
      - export SUMMARY_URL=`aws s3 presign "s3://${ARTIFACT_BUCKET}/plans/${TF_ENV}/latest/plan-summary.txt" --expires-in 86400`
      - echo "[PLAN_REVIEW_URL] $PLAN_URL"
      - echo "[SUMMARY_REVIEW_URL] $SUMMARY_URL"
  post_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] Plan completed successfully"
      - echo "[PLAN] Review plan-summary.txt / plan.txt (pipeline artifacts) before approving"

artifacts:
  files:
    - 'tfplan'
    - 'plan.txt'
    - 'plan-summary.txt'
  name: TfPlanOutput
  discard-paths: yes
