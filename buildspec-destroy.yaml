version: 0.2

# This buildspec is used for TERRAFORM DESTROY phase
# Removes all Terraform-managed application resources for the environment
# The pipeline bootstrap resources (CodePipeline, CodeBuild, S3, KMS) are NOT affected
# Triggered manually via the Destroy stage in the pipeline

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - '[ -n "${TF_DIR:-}" ]     || (echo "[ERROR] TF_DIR environment variable is not set in the CodeBuild project" && exit 1)'
      - '[ -n "${TF_ENV:-}" ]     || (echo "[ERROR] TF_ENV environment variable is not set in the CodeBuild project" && exit 1)'
      - '[ -n "${TF_VERSION:-}" ] || (echo "[ERROR] TF_VERSION environment variable is not set in the CodeBuild project" && exit 1)'
      - echo "[INFO] TF_DIR=${TF_DIR} | TF_ENV=${TF_ENV} | TF_VERSION=${TF_VERSION}"
      - echo "[INFO] Installing Terraform"
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform -version

  pre_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] Reading Azure PAT from SSM"
      - export AZURE_PAT_VALUE=`aws ssm get-parameter --name "${AZURE_PAT_SSM_NAME}" --with-decryption --query "Parameter.Value" --output text`
      - cd "$CODEBUILD_SRC_DIR/${TF_DIR}"
      - test -f "environments/${TF_ENV}.tfvars" || (echo "[ERROR] Missing tfvars" && exit 1)
      - echo "[INFO] terraform init"
      - |
        terraform init \
          -input=false \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=${TF_STATE_KEY}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"

  build:
    commands:
      - set -euo pipefail
      - echo "[WARNING] TERRAFORM DESTROY - This will PERMANENTLY DELETE all Terraform-managed resources for env=${TF_ENV}"
      - echo "[INFO] ========== EMPTYING S3 BUCKETS BEFORE DESTROY =========="
      - export STACK_NAME=$(grep '^stack_name' "environments/${TF_ENV}.tfvars" | awk -F'"' '{print $2}')
      - echo "[INFO] STACK_NAME=${STACK_NAME}"
      - export JOB_BUCKET="${STACK_NAME}-schedule"
      - echo "[INFO] Emptying job bucket s3://${JOB_BUCKET}"
      - aws s3 rm "s3://${JOB_BUCKET}" --recursive || echo "[INFO] Job bucket already empty or does not exist"
      - echo "[INFO] ========== RUNNING TERRAFORM DESTROY =========="
      - |
        terraform destroy \
          -input=false \
          -no-color \
          -auto-approve \
          -var-file="environments/${TF_ENV}.tfvars" \
          -var="azure_pat_encrypted=${AZURE_PAT_VALUE}"

  post_build:
    commands:
      - set -euo pipefail
      - echo "[SUCCESS] Terraform destroy completed for env=${TF_ENV}"
      - echo "[INFO] Pipeline infrastructure (CodePipeline, CodeBuild, S3, KMS, IAM) was NOT removed"
      - echo "[INFO] To remove those run aws cloudformation delete-stack --stack-name <stack-name>"
