AWSTemplateFormatVersion: "2010-09-09"
Description: "Bootstrap CodePipeline+CodeBuild to run Terraform; creates TF state S3 bucket and DynamoDB lock table."

Parameters:

  StackName:
    Type: String
    Default: azure

  Environment:
    Description: "Target environment (dev, test, prod). Controls TF_ENV, branch, state key, and resource naming."
    Type: String
    Default: mgmt

  RepoBranch:
    Type: String
    Default: develop

  GitHubTeam:
    Description: GitHub organization/team name
    Type: String
    Default: skape007
#    Default: AWS::NoValue

  GitHubRepo:
    Description: GitHub repository name
    Type: String
    Default: terraform
#    Default: AWS::NoValue

  GitHubCloudConnectionArn:
    Description: The ARN for GitHub Codestar Connection
    Type: String
    Default: arn:aws:codeconnections:eu-west-1:977206434297:connection/0d73034a-6f0b-4120-9bfb-71a80c55cc28
#    Default: AWS::NoValue

  RootAccount:
    Description: AWS account serving as root account (uses SAML authorization with Vodafone ADFS)
    Type: String
    MinLength: 12
    MaxLength: 12
    AllowedPattern: "[0-9]{12}"
    Default: 977206434297

  S3Lifecycle:
    Description: Flag to enable/disable S3 Lifecycle management
    Type: String
    Default: Disabled

  S3LifecycleExpirationInDays:
    Description: Indicates the number of days after creation when objects are deleted
    Type: Number
    Default: 30

  CodePipelineType:
    Description: Type of CodePipeline to be deployed
    Type: String
    Default: V2
    AllowedValues:
      - V1
      - V2
    ConstraintDescription: Refer to https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-codepipeline-pipeline.html

  AZUREPATSSMParameterSufix:
    Description: Suffix for the SSM parameter name that will store the Azure PAT. The full parameter name will be /{StackName}/{Environment}/{Suffix}
    Type: String
    Default: pat

Conditions:

  IsV2CodePipelineType: !Equals [!Ref CodePipelineType, "V2"]

Resources:

  KMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    Properties:
      Description: "Used to encrypt DEP Azure S3 artifacts used in Terraform (CI/CD) automation"
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: !Ref StackName
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${RootAccount}:root"
            Action:
              - kms:*
            Resource: '*'

  KMSAlias:
    Type: AWS::KMS::Alias
    DependsOn:
      - KMSKey
    Properties:
      AliasName: !Sub "alias/kms/${StackName}-${Environment}-cicd"
      TargetKeyId: !Ref KMSKey

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackName}-${Environment}-tf-state-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt KMSKey.Arn
              SSEAlgorithm: "aws:kms"
#      LoggingConfiguration:
#        DestinationBucketName: !Ref LoggingBucketName
#        LogFilePrefix: !Sub "${StackName}-cicd-artifacts/"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanUpRule
            Status: !Ref S3Lifecycle
            ExpirationInDays: !Ref S3LifecycleExpirationInDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ArtifactS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackName}-${Environment}-pipeline-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt KMSKey.Arn
              SSEAlgorithm: "aws:kms"
#      LoggingConfiguration:
#        DestinationBucketName: !Ref LoggingBucketName
#        LogFilePrefix: !Sub "${StackName}-cicd-artifacts/"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanUpRule
            Status: !Ref S3Lifecycle
            ExpirationInDays: !Ref S3LifecycleExpirationInDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ArtifactS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn:
      - ArtifactS3Bucket
    Properties:
      Bucket: !Ref ArtifactS3Bucket
      PolicyDocument:
        Statement:
          - Sid: EnforceHTTPS
            Effect: Deny
            Principal: "*"
            Action:
              - s3:*
            Resource:
              - !GetAtt ArtifactS3Bucket.Arn
              - !Join ['',[!GetAtt ArtifactS3Bucket.Arn, '/*']]
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  CodeBuildIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackName}-${Environment}-codebuild"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole

  CodeBuildIAMRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn:
      - ArtifactS3Bucket
    Properties:
      Roles:
        - !Ref CodeBuildIAMRole
      ManagedPolicyName: !Sub "${StackName}-${Environment}-codebuild"
      PolicyDocument:
        Version: 2012-10-17
        Statement:

          # ------------------------------------------------------------------
          # CodeBuild internals — CloudWatch Logs
          # ------------------------------------------------------------------
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StackName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StackName}-${Environment}-*:*"
          # ------------------------------------------------------------------
          # S3 — store TF state, CodeBuild artifacts, and Lambda deployment packages
          # ------------------------------------------------------------------
          - Sid: S3AppBuckets
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${StackName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:s3:::${StackName}-${Environment}-*/*"
              - !GetAtt ArtifactS3Bucket.Arn
              - !Join [ '', [ !GetAtt ArtifactS3Bucket.Arn, '/*' ] ]
              - !GetAtt TerraformStateBucket.Arn
              - !Join [ '', [ !GetAtt TerraformStateBucket.Arn, '/*' ] ]

          # ------------------------------------------------------------------
          # KMS — encrypt/decrypt S3 artifacts, Terraform state and SSM param
          # ------------------------------------------------------------------
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource:
              - !GetAtt KMSKey.Arn

          # ------------------------------------------------------------------
          # SSM — read the Azure PAT SecureString at plan/apply time
          # ------------------------------------------------------------------
          - Sid: SSMGetAzurePat
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackName}-${Environment}-${AZUREPATSSMParameterSufix}"

          # ------------------------------------------------------------------
          # IAM — manage the Lambda execution role and its policies
          # ------------------------------------------------------------------
          - Sid: IAMRolesAndPolicies
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${StackName}-${Environment}-*"

          # ------------------------------------------------------------------
          # Lambda — functions and layers
          # ------------------------------------------------------------------
          - Sid: LambdaFunctions
            Effect: Allow
            Action:
              - lambda:*
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${StackName}-${Environment}*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${StackName}-${Environment}*:*"

          # ------------------------------------------------------------------
          # DynamoDB — schedule table
          # ------------------------------------------------------------------
          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:*
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}-${Environment}-*"

          # ------------------------------------------------------------------
          # CloudFront — distribution and OAC (global service, no region ARN)
          # ------------------------------------------------------------------
          - Sid: CloudFront
            Effect: Allow
            Action:
              - cloudfront:*
            Resource: "*"

          # ------------------------------------------------------------------
          # EventBridge — hourly automations rule
          # ------------------------------------------------------------------
          - Sid: EventBridge
            Effect: Allow
            Action:
              - events:*
            Resource:
              - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${StackName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/per-job-*"

          # ------------------------------------------------------------------
          # SES — Terraform reads identity info; Lambda handles actual sends
          # ------------------------------------------------------------------
          - Sid: SES
            Effect: Allow
            Action:
              - ses:GetIdentityVerificationAttributes
              - ses:GetEmailIdentity
              - ses:ListEmailIdentities
            Resource: "*"

          # ------------------------------------------------------------------
          # Misc — account info, tagging, cross-account, signer
          # ------------------------------------------------------------------
          - Sid: Miscellaneous
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - sts:GetServiceBearerToken
              - sts:AssumeRole
              - tag:GetResources
              - signer:GetSigningPlatform
              - signer:ListSigningPlatforms
              - signer:ListSigningProfiles
              - signer:GetSigningProfile
              - signer:PutSigningProfile
              - signer:AddProfilePermission
              - signer:ListProfilePermissions
              - signer:TagResource
              - signer:DescribeSigningJob
              - signer:ListSigningJobs
              - signer:StartSigningJob
            Resource: "*"

  ApprovalSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${StackName}-${Environment}-pipeline-approval"
      DisplayName: "Pipeline Approval Notifications"

  CodeBuildProjectPlan:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildIAMRolePolicy
    Properties:
      Name: !Sub "${StackName}-${Environment}-terraform-plan"
      ServiceRole: !GetAtt CodeBuildIAMRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
          - Name: TF_STATE_KEY
            Value: !Sub "${StackName}/${Environment}/terraform.tfstate"
          - Name: TF_COMMAND
            Value: plan
          - Name: TF_ENV
            Value: !Ref Environment
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactS3Bucket
          - Name: AZURE_PAT_SSM_NAME
            Value: !Sub "${StackName}-${Environment}-${AZUREPATSSMParameterSufix}"
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-plan.yml
      Cache:
        Type: NO_CACHE
      TimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${StackName}-${Environment}-terraform-plan"

  CodeBuildProjectApply:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildIAMRolePolicy
    Properties:
      Name: !Sub "${StackName}-${Environment}-terraform-apply"
      ServiceRole: !GetAtt CodeBuildIAMRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
          - Name: TF_STATE_KEY
            Value: !Sub "${StackName}/${Environment}/terraform.tfstate"
          - Name: TF_COMMAND
            Value: apply
          - Name: TF_ENV
            Value: !Ref Environment
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactS3Bucket
          - Name: AZURE_PAT_SSM_NAME
            Value: !Sub "${StackName}-${Environment}-${AZUREPATSSMParameterSufix}"
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-apply.yml
      Cache:
        Type: NO_CACHE
      TimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${StackName}-${Environment}-terraform-apply"

  CodeBuildProjectDestroy:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildIAMRolePolicy
    Properties:
      Name: !Sub "${StackName}-${Environment}-terraform-destroy"
      ServiceRole: !GetAtt CodeBuildIAMRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
          - Name: TF_STATE_KEY
            Value: !Sub "${StackName}/${Environment}/terraform.tfstate"
          - Name: TF_ENV
            Value: !Ref Environment
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactS3Bucket
          - Name: AZURE_PAT_SSM_NAME
            Value: !Sub "${StackName}-${Environment}-${AZUREPATSSMParameterSufix}"
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-destroy.yml
      Cache:
        Type: NO_CACHE
      TimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${StackName}-${Environment}-terraform-destroy"

  CodePipelineIAMRole:
    Type: AWS::IAM::Role
    DependsOn:
      - ArtifactS3Bucket
    Properties:
      RoleName: !Sub "${StackName}-${Environment}-pipeline"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole

  CodePipelineIAMRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref CodePipelineIAMRole
      ManagedPolicyName: !Sub "${StackName}-${Environment}-pipeline"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: CrossAccountRole
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::*:role/${StackName}_cross_account"
          - Sid: ArtifactS3Bucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetBucketAcl
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt ArtifactS3Bucket.Arn
              - !Join ['', [!GetAtt ArtifactS3Bucket.Arn, '/*']]
          - Sid: CodeBuildProject
            Effect: Allow
            Action:
              - codebuild:StartBuild
              - codebuild:BatchGetBuilds
            Resource:
              - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${StackName}-*"
          - Sid: CodeStarConnection
            Effect: Allow
            Action:
              - codestar-connections:UseConnection
              - codestar-connections:PassConnection
            Resource:
              - !Ref GitHubCloudConnectionArn
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource:
              - !GetAtt KMSKey.Arn
          - Sid: SNSPublish
            Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Ref ApprovalSNSTopic

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${StackName}-${Environment}-pipeline"
      RoleArn: !GetAtt CodePipelineIAMRole.Arn
      PipelineType: !Ref CodePipelineType
      ExecutionMode: !If [IsV2CodePipelineType, QUEUED, SUPERSEDED]
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactS3Bucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubCloudConnectionArn
                FullRepositoryId: !Sub "${GitHubTeam}/${GitHubRepo}"
                BranchName: !Ref RepoBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Plan
          Actions:
            - Name: TerraformPlan
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProjectPlan
                EnvironmentVariables: !Sub |
                  [
                    {
                      "name": "TF_COMMAND",
                      "value": "plan",
                      "type": "PLAINTEXT"
                    }
                  ]
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: TfPlanOutput
            - Name: ManualApprovalForApply
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: !Sub "Review plan.txt and plan-summary.txt before approving. Click 'Review' to open the S3 folder, or check the TerraformPlan CodeBuild logs for pre-signed download URLs."
                ExternalEntityLink: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${ArtifactS3Bucket}?prefix=plans/${Environment}/latest/&region=${AWS::Region}"
                NotificationArn: !Ref ApprovalSNSTopic
        - Name: Deploy
          Actions:
            - Name: TerraformApply
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProjectApply
                PrimarySource: SourceOutput
                EnvironmentVariables: !Sub |
                  [
                    {
                      "name": "TF_COMMAND",
                      "value": "apply",
                      "type": "PLAINTEXT"
                    }
                  ]
              InputArtifacts:
                - Name: SourceOutput
                - Name: TfPlanOutput
        - Name: Destroy
          Actions:
            - Name: ManualApprovalForDestroy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              RunOrder: 1
              Configuration:
                CustomData: "WARNING: This will permanently delete all Terraform-managed resources for this environment. Only approve if you intend to tear down the infrastructure."
                NotificationArn: !Ref ApprovalSNSTopic
            - Name: TerraformDestroy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildProjectDestroy
              InputArtifacts:
                - Name: SourceOutput

Outputs:

  StateBucketName:
    Value: !Ref TerraformStateBucket
    Description: "S3 bucket used to store Terraform remote state"

  PipelineName:
    Value: !Ref Pipeline
    Description: "CodePipeline name for this environment"

  ArtifactBucketName:
    Value: !Ref ArtifactS3Bucket
    Description: "S3 bucket used to store pipeline artifacts (Lambda zips, layer, plan files)"

  EnvironmentName:
    Description: "Deployed environment name"
    Value: !Ref Environment

  CodeBuildProjectPlanName:
    Value: !Ref CodeBuildProjectPlan
    Description: CodeBuild project for terraform plan

  CodeBuildProjectApplyName:
    Value: !Ref CodeBuildProjectApply
    Description: "CodeBuild project for terraform apply"

  CodeBuildProjectDestroyName:
    Value: !Ref CodeBuildProjectDestroy
    Description: "CodeBuild project for terraform destroy — removes all Terraform-managed app resources"

  KMSKeyArn:
    Value: !GetAtt KMSKey.Arn
    Description: "KMS key ARN — used to encrypt S3 artifacts and the Azure PAT SSM parameter"

  KMSKeyAlias:
    Value: !Sub "alias/kms/${StackName}-${Environment}_cicd"
    Description: "KMS key alias — use this when creating the Azure PAT SSM SecureString parameter"

  AzurePatSsmParameterName:
    Value: !Sub "${StackName}-${Environment}-${AZUREPATSSMParameterSufix}"
    Description: >
      MANUAL STEP REQUIRED — CloudFormation cannot create SecureString SSM parameters.
      After this stack deploys run: aws ssm put-parameter
      --name "/${StackName}/${Environment}/${AZUREPATSSMParameterSufix}"
      --value "YOUR_AZURE_PAT" --type SecureString
      --key-id "alias/kms/${StackName}-${Environment}-cicd" --region eu-west-1

  ApprovalSNSTopicArn:
    Value: !Ref ApprovalSNSTopic
    Description: "SNS topic ARN used to send manual approval notifications for the pipeline"

  CodeBuildIAMRoleArn:
    Value: !GetAtt CodeBuildIAMRole.Arn
    Description: "IAM role ARN assumed by CodeBuild projects during plan and apply"

  CodePipelineIAMRoleArn:
    Value: !GetAtt CodePipelineIAMRole.Arn
    Description: "IAM role ARN assumed by CodePipeline to orchestrate pipeline stages"

