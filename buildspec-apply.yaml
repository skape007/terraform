version: 0.2

# This buildspec is used for TERRAFORM APPLY phase
# TF_ENV is set by the pipeline (CodeBuild environment variable) per environment
# Applies the previously approved plan to AWS infrastructure

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - '[ -n "${TF_DIR:-}" ]     || (echo "[ERROR] TF_DIR environment variable is not set in the CodeBuild project" && exit 1)'
      - '[ -n "${TF_ENV:-}" ]     || (echo "[ERROR] TF_ENV environment variable is not set in the CodeBuild project" && exit 1)'
      - '[ -n "${TF_VERSION:-}" ] || (echo "[ERROR] TF_VERSION environment variable is not set in the CodeBuild project" && exit 1)'
      - echo "[INFO] TF_DIR=${TF_DIR} | TF_ENV=${TF_ENV} | TF_VERSION=${TF_VERSION}"
      - echo "[INFO] Installing Terraform"
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform -version
  pre_build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR/${TF_DIR}"
      - test -f "environments/$TF_ENV.tfvars" || (echo "[ERROR] Missing tfvars" && exit 1)
      - echo "[INFO] terraform init"
      - |
        terraform init \
          -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=$TF_STATE_KEY" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"
  build:
    commands:
      - set -euo pipefail
      - echo "[INFO] APPROVED - Starting terraform apply"
      - echo "[WARNING] This will make REAL changes to AWS infrastructure!"
      - echo "[INFO] CODEBUILD_SRC_DIR_TfPlanOutput=$CODEBUILD_SRC_DIR_TfPlanOutput"
      - ls -la "$CODEBUILD_SRC_DIR_TfPlanOutput"
      - |
        terraform apply \
          -input=false \
          -no-color \
          "$CODEBUILD_SRC_DIR_TfPlanOutput/tfplan"
  post_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] Terraform apply completed successfully"
      - echo "[INFO] ========== S3 FOLDER STRUCTURE AND HTML UPLOAD =========="
      - export JOB_BUCKET=`terraform output -raw job_bucket_name`
      - echo "[INFO] Job bucket is $JOB_BUCKET"
      - echo "[INFO] Creating S3 folder structure if bucket is empty"
      - |
        OBJECT_COUNT=$(aws s3 ls "s3://$JOB_BUCKET" --recursive | wc -l | tr -d ' ')
        if [ "$OBJECT_COUNT" -eq 0 ]; then
          echo "[INFO] Bucket is empty, creating folder structure"
          printf "" > /tmp/empty
          aws s3 cp /tmp/empty "s3://$JOB_BUCKET/jobs/active/"
          aws s3 cp /tmp/empty "s3://$JOB_BUCKET/jobs/deleted/"
        else
          echo "[INFO] Bucket already has objects, skipping folder structure creation"
        fi
      - echo "[INFO] Uploading index.html to bucket root"
      - aws s3 cp "$CODEBUILD_SRC_DIR/html/index.html" "s3://$JOB_BUCKET/index.html" --content-type "text/html"
      - echo "[SUCCESS] Infrastructure and S3 content deployed"

artifacts:
  files:
    - 'tfplan'
  name: TfApplyOutput
  discard-paths: yes
